<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SurakshaRoad — First Aid</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{--red:#C62828;--green:#2E7D32;--bg:#F7F7F7;--card:#fff;--text:#1A1A1A;--muted:#757575;--border:#E0E0E0;--radius:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh}
  header{background:var(--green);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
  header h1{font-family:'Baloo 2',cursive;font-size:18px;font-weight:800}
  .back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:14px}
  .offline-note{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px}
  .content{max-width:500px;margin:0 auto;padding:0 16px 24px}

  /* Tabs */
  .fa-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .fa-tab{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--muted);transition:all .15s;font-family:'Nunito',sans-serif}
  .fa-tab:hover{border-color:var(--red);color:var(--red)}
  .fa-tab.active{background:var(--red);color:#fff;border-color:var(--red)}

  /* Panels */
  .fa-panel{display:none}
  .fa-panel.active{display:block}

  /* Steps */
  .fa-step{background:var(--card);border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.06);border:1.5px solid var(--border)}
  .step-num{width:30px;height:30px;background:var(--red);color:#fff;border-radius:50%;font-family:'Baloo 2',cursive;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
  .step-body strong{font-size:14px;font-weight:700;color:var(--text);display:block;margin-bottom:3px}
  .step-body p{font-size:12px;color:var(--muted);line-height:1.6}

  /* Loading / error */
  .loading-msg{text-align:center;padding:32px 16px;color:var(--muted);font-size:13px}
  .err-msg{background:#FFEBEE;border-radius:10px;padding:14px;font-size:13px;color:var(--red);text-align:center}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="history.back()">← Back</button>
  <h1>🩹 First Aid Guide</h1>
</header>
<div class="offline-note">✅ Fully offline — follow these steps while waiting for help</div>
<div class="content">
  <div class="fa-tabs">
    <button class="fa-tab active"  onclick="setTab(this,'bleeding')">🩸 Bleeding</button>
    <button class="fa-tab"         onclick="setTab(this,'fracture')">🦴 Fracture</button>
    <button class="fa-tab"         onclick="setTab(this,'unconscious')">😵 Unconscious</button>
    <button class="fa-tab"         onclick="setTab(this,'burns')">🔥 Burns</button>
    <button class="fa-tab"         onclick="setTab(this,'choking')">🫁 Choking</button>
    <button class="fa-tab"         onclick="setTab(this,'heart_attack')">❤️ Heart Attack</button>
    <button class="fa-tab"         onclick="setTab(this,'seizure')">⚡ Seizure</button>
    <button class="fa-tab"         onclick="setTab(this,'drowning')">💧 Drowning</button>
  </div>

  <!-- All 8 panels — all present in DOM -->
  <div id="fa-bleeding"     class="fa-panel active"></div>
  <div id="fa-fracture"     class="fa-panel"></div>
  <div id="fa-unconscious"  class="fa-panel"></div>
  <div id="fa-burns"        class="fa-panel"></div>
  <div id="fa-choking"      class="fa-panel"></div>
  <div id="fa-heart_attack" class="fa-panel"></div>
  <div id="fa-seizure"      class="fa-panel"></div>
  <div id="fa-drowning"     class="fa-panel"></div>
</div>

<script>
  let _data = null;

  async function loadData() {
    if (_data) return _data;
    try {
      const r = await fetch('data/firstaid.json');
      if (!r.ok) throw new Error('Not found');
      _data = await r.json();
      return _data;
    } catch {
      return null;
    }
  }

  async function renderTab(cat) {
    const container = document.getElementById('fa-' + cat);
    if (!container) return;

    // Already rendered
    if (container.dataset.rendered === 'true') return;

    container.innerHTML = '<div class="loading-msg">Loading…</div>';
    const data = await loadData();

    if (!data) {
      container.innerHTML = '<div class="err-msg">Could not load first aid data. Make sure data/firstaid.json exists.</div>';
      return;
    }
    if (!data[cat] || !data[cat].length) {
      container.innerHTML = '<div class="err-msg">No steps found for this category.</div>';
      return;
    }

    container.innerHTML = data[cat].map((s, i) => `
      <div class="fa-step">
        <div class="step-num">${i + 1}</div>
        <div class="step-body">
          <strong>${s.title}</strong>
          ${s.detail ? `<p>${s.detail}</p>` : ''}
        </div>
      </div>`).join('');

    container.dataset.rendered = 'true';
  }

  function setTab(el, cat) {
    document.querySelectorAll('.fa-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.fa-panel').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    const panel = document.getElementById('fa-' + cat);
    if (panel) panel.classList.add('active');
    renderTab(cat);
  }

  window.addEventListener('load', () => renderTab('bleeding'));
</script>
</body>
</html>
